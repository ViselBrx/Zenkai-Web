<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenkai</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 480px;
      height: 320px;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', sans-serif;
    }

    .splash {
      width: 480px;
      height: 320px;
      background: linear-gradient(135deg, #0d0d1a 0%, #1a0a2e 50%, #0d0d1a 100%);
      border-radius: 16px;
      border: 1px solid rgba(138, 43, 226, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 40px rgba(138, 43, 226, 0.3),
        0 0 80px rgba(138, 43, 226, 0.1),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* Partículas de fundo */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(138, 43, 226, 0.6);
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(100%) translateX(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-20px) translateX(20px); opacity: 0; }
    }

    /* Brilho de fundo */
    .glow-bg {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse-bg 3s ease-in-out infinite;
    }

    @keyframes pulse-bg {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* Conteúdo principal */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Ícone */
    .logo-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
    }

    .logo-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: linear-gradient(135deg, #8a2be2, #e040fb, #8a2be2) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: spin-ring 4s linear infinite;
    }

    @keyframes spin-ring {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .logo-bg {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #2d1b5e, #1a0a2e);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 20px rgba(138, 43, 226, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .logo-bg img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(200, 100, 255, 0.6));
    }

    /* Nome do app */
    .app-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #c084fc, #e040fb, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
    }

    /* Loading bar */
    .loading-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .loading-bar-bg {
      width: 200px;
      height: 3px;
      background: rgba(138, 43, 226, 0.15);
      border-radius: 99px;
      overflow: hidden;
    }

    .loading-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #8a2be2, #e040fb);
      border-radius: 99px;
      animation: slide 1.5s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); width: 40%; }
      50%  { width: 60%; }
      100% { transform: translateX(350%); width: 40%; }
    }

    .loading-text {
      font-size: 11px;
      color: rgba(200, 150, 255, 0.6);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 1; }
    }

    /* Versão */
    .version {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 10px;
      color: rgba(138, 43, 226, 0.35);
      letter-spacing: 1px;
    }
  </style>
</head>

  <script>
    // Gera partículas aleatórias
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 1;
      p.style.width  = size + 'px';
      p.style.height = size + 'px';
      p.style.left   = Math.random() * 100 + '%';
      p.style.bottom = '-10px';
      p.style.animationDuration  = (Math.random() * 4 + 3) + 's';
      p.style.animationDelay     = (Math.random() * 4) + 's';
      p.style.opacity = Math.random() * 0.6 + 0.2;
      container.appendChild(p);
    }
  </script>
