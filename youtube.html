<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime House — YouTube</title>
  <meta name="description" content="Catálogo pessoal de vídeos do YouTube organizados em playlists." />
  <link rel="icon" type="image/jpeg" href="assets/tryhard.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/themes.js"></script>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-brand">
    <img src="assets/tryhard.png" alt="Mascote" style="height:50px;width:auto;object-fit:contain;" />
    <span>Anime</span>House
  </div>
  <ul class="navbar-links" id="navLinks">
  </ul>
  <button class="navbar-burger" id="navBurger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- CONTEÚDO PRINCIPAL -->
<main class="main-content">
  <div class="page-header" style="flex-direction: column; justify-content: center; align-items: center;">
    <div class="header-main" style="text-align: center;">
      <h1>▶️ Catálogo do YouTube</h1>
      <p>Explore sua coleção de vídeos organizados em playlists</p>
    </div>
  </div>

  <!-- BUSCA E FILTROS -->
  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="🔍  Pesquisar playlist..." />
  </div>

  <!-- GRID DE CARDS -->
  <div id="cardsGrid" class="cards-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="empty-icon">📭</div>
    <p>Nenhuma playlist encontrada.<br>Acesse <a href="cadastro-youtube.html" style="color:var(--primary)">Cadastro de YouTube</a> para adicionar.</p>
  </div>
</main>

<!-- MODAL DETALHES -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">—</h2>
      <button class="modal-close" id="detailClose">✕</button>
    </div>
    <img id="detailCover" src="" alt="" style="width:100%;max-height:320px;object-fit:cover;border-radius:10px;margin-bottom:1rem;" />
    <div id="detailCoverPlaceholder" class="card-cover-placeholder" style="border-radius:10px;margin-bottom:1rem;display:none;">▶️</div>
    <div style="display:flex;gap:.8rem;margin-top:1.5rem;">
      <a id="detailWatchBtn" href="youtube-videos.html" class="btn btn-primary" style="flex:1;justify-content:center;">▶️ Assistir Vídeos</a>
      <a href="cadastro-youtube.html" class="btn btn-ghost" style="flex:1;justify-content:center;">✏️ Editar Playlist</a>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="js/db.js"></script>
<script src="js/youtube.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<div class="watermark">© ViselBrx & DaviMoraes07™</div>
</body>
</html>
