<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime House — Hub de Jogos</title>
  <link rel="icon" type="image/jpeg" href="assets/tryhard.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js-ofuscado/themes.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    .game-hub-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .game-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .game-header h1 {
      color: var(--primary);
      font-family: 'Bangers', cursive;
      font-size: 3rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .game-header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .game-actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 40px;
    }

    .game-action-card {
      background: var(--bg-card);
      border: 1px solid rgba(var(--primary-rgb), 0.2);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .game-action-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(var(--primary-rgb), 0.2);
      border-color: var(--primary);
    }

    .game-action-card i {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 15px;
    }

    .game-action-card h3 {
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .game-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(var(--text-muted-rgb, 150, 150, 150), 0.3);
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    .game-input:focus {
      border-color: var(--primary);
    }

    .game-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(var(--text-muted-rgb, 150, 150, 150), 0.3);
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      outline: none;
    }

    .game-select option {
      background: var(--bg-card);
    }

    .btn-game {
      width: auto;
      min-width: 180px;
      background: var(--primary);
      color: #000;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(var(--primary-rgb), 0.3);
    }

    .btn-game:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(var(--primary-rgb), 0.5);
    }

    .btn-join {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      box-shadow: none;
    }

    .btn-join:hover {
      background: rgba(var(--primary-rgb), 0.1);
      box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.2);
    }

    @media (max-width: 768px) {
      .game-actions-grid {
        grid-template-columns: 1fr;
      }
    }


  </style>
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <img src="assets/tryhard.png" alt="Mascote" style="height:50px;width:auto;object-fit:contain;" />
      <span>Anime</span>House
    </a>
    <ul class="navbar-links" id="navLinks">
    </ul>
    <button class="navbar-burger" id="navBurger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main class="container game-hub-container">
    <div class="game-header">
      <h1><i class="fa-solid fa-gamepad"></i> Hub de Jogos Multiplayer</h1>
      <p>Jogue com seus amigos em tempo real, ganhe XP e suba no ranking!</p>
    </div>

    <div class="game-actions-grid">
      <!-- Criar Sala -->
      <div class="game-action-card">
        <i class="fa-solid fa-plus-circle"></i>
        <h3>Criar uma Sala</h3>
        <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Crie uma sala e convide seus amigos para jogar.</p>
        
        <div class="community-filter" style="margin-bottom: 15px; text-align: left; background: transparent; border: none; padding: 0; box-shadow: none;">
          <select id="gameTypeSelect" class="game-select" style="width: 100%;">
            <option value="gartic">Desenhe e Adivinhe (Gartic Anime)</option>
            <option value="velha">Jogo da Velha Temático</option>
          </select>
        </div>

        <div class="community-filter" style="margin-bottom: 25px; text-align: left; background: transparent; border: none; padding: 0; box-shadow: none;">
          <select id="gameThemeSelect" class="game-select" style="width: 100%;">
            <option value="livre">Tema Livre</option>
            <optgroup label="Desenhos">
              <option value="apenas-um-show">Apenas um Show</option>
              <option value="gumball">Incrível Mundo de Gumball</option>
              <option value="hora-de-aventura">Hora de Aventura</option>
            </optgroup>
            <optgroup label="Animes">
              <option value="naruto">Naruto</option>
              <option value="aot">Attack on Titan</option>
              <option value="demon-slayer">Demon Slayer</option>
            </optgroup>
          </select>
        </div>

        <button id="btnCreateRoom" class="btn-game">
          Criar Sala
        </button>
      </div>

      <!-- Entrar em Sala -->
      <div class="game-action-card">
        <i class="fa-solid fa-right-to-bracket"></i>
        <h3>Entrar em uma Sala</h3>
        <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Tem um código de convite? Digite abaixo.</p>
        
        <input type="text" id="roomCodeInput" class="game-input" placeholder="Ex: SALA-XZ92" style="text-transform: uppercase; margin-bottom: 25px;">
        
        <button id="btnJoinRoom" class="btn-game btn-join">
          <i class="fa-solid fa-door-open"></i> Entrar na Sala
        </button>
      </div>
    </div>
  </main>



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js-ofuscado/db.js"></script>
  <script src="js-ofuscado/auth.js"></script>
  <script src="js-ofuscado/custom-select.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btnCreate = document.getElementById('btnCreateRoom');
      const btnJoin = document.getElementById('btnJoinRoom');
      
      btnCreate.addEventListener('click', () => {
        const gameType = document.getElementById('gameTypeSelect').value;
        const theme = document.getElementById('gameThemeSelect').value;
        
        // Gera um código de sala aleatório
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let roomId = 'SALA-';
        for (let i = 0; i < 4; i++) {
          roomId += chars.charAt(Math.floor(Math.random() * chars.length));
        }

        // Redireciona para o lobby ou direto pro jogo, passando parâmetros na URL
        const url = gameType === 'gartic' ? 'jogo-gartic.html' : 'jogo-velha.html';
        window.location.href = `${url}?room=${roomId}&theme=${theme}&host=true`;
      });

      btnJoin.addEventListener('click', () => {
        const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
        if (!code) {
          alert("Por favor, digite o código da sala.");
          return;
        }
        
        // Como o usuário está apenas entrando, ele não sabe qual jogo é ainda até conectar.
        // Mas por simplicidade inicial, podemos mandar pro lobby. 
        // Na implementação avançada, faríamos um check no Realtime para saber qual jogo está rolando.
        // Vamos redirecionar para um "lobby" intermediário (vou criar) ou alertar que estamos construindo.
        window.location.href = `lobby.html?room=${code}`;
      });
    });
  </script>
  <div class="watermark"><a href="sobre.html" style="color: inherit; text-decoration: none;">&copy; ViselBrx & DaviMoraes07&trade;</a></div>
</body>
</html>
