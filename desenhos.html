<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenkai — Início</title>
  <meta name="description" content="Catálogo pessoal de desenhos e animes com visualização por temporadas e episódios." />
  <link rel="icon" type="image/jpeg" href="assets/tryhard.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js-ofuscado/themes.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <img src="assets/tryhard.png" alt="Mascote" style="height:50px;width:auto;object-fit:contain;" />
    <span>Zen</span>kai
  </a>
  <ul class="navbar-links" id="navLinks">
  </ul>
  <button class="navbar-burger" id="navBurger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- CONTEÚDO PRINCIPAL -->
<main class="main-content">
  <div class="page-header" style="flex-direction: column; justify-content: center; align-items: center;">
    <div class="header-main" style="text-align: center;">
      <h1><i class='fa-solid fa-flag'></i> Catálogo de Desenhos</h1>
      <p>Explore sua coleção de animes e desenhos favoritos</p>
    </div>
  </div>

  <!-- BUSCA E FILTROS -->
  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="Pesquisar desenho..." />
    <select id="filterProdutora">
      <option value="">Todas as produtoras</option>
    </select>
    <select id="filterTemporadas">
      <option value="">Qtd. de temporadas</option>
      <option value="1">1 temporada</option>
      <option value="2">2 temporadas</option>
      <option value="3">3 temporadas</option>
      <option value="4">4+</option>
    </select>
    <select id="filterFavoritos">
      <option value="">Todos os itens</option>
      <option value="favoritos">Meus Favoritos</option>
    </select>
  </div>

  <!-- GRID DE CARDS -->
  <div id="cardsGrid" class="cards-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="empty-icon"><i class='fa-solid fa-envelope'></i></div>
    <p>Nenhum desenho encontrado.<br>Acesse <a href="cadastro.html" style="color:var(--primary)">Cadastro</a> para adicionar.</p>
  </div>
</main>

<!-- MODAL DETALHES -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">—</h2>
      <button class="modal-close" id="detailClose">✕</button>
    </div>
    <img id="detailCover" src="" alt="" style="width:100%;max-height:320px;object-fit:cover;border-radius:10px;margin-bottom:1rem;" />
    <div id="detailCoverPlaceholder" class="card-cover-placeholder" style="border-radius:10px;margin-bottom:1rem;display:none;"><i class='fa-solid fa-clapperboard'></i></div>
    <p><strong>Produtora:</strong> <span id="detailProdutora">—</span></p>
    <p style="margin-top:6px"><strong>Temporadas:</strong> <span id="detailTemporadas">—</span></p>
    <div style="display:flex;gap:.8rem;margin-top:1.5rem;">
      <a id="detailWatchBtn" href="episodios-desenhos.html" class="btn btn-primary" style="flex:1;justify-content:center;"><i class='fa-solid fa-play'></i> Assistir Episódios</a>
      <a href="cadastro.html" class="btn btn-ghost" style="flex:1;justify-content:center;"><i class='fa-solid fa-pencil'></i> Editar</a>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="js-ofuscado/db.js"></script>
<script src="js-ofuscado/home.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js-ofuscado/auth.js"></script>
<div class="watermark">&copy; ViselBrx & DaviMoraes07&trade;</div>
<script src="js-ofuscado/custom-select.js"></script>
<script src="js-ofuscado/guard.js"></script>
</body>
</html>
