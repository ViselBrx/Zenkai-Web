<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime House — Vídeos do YouTube</title>
  <meta name="description" content="Assista aos vídeos das suas playlists favoritas." />
  <link rel="icon" type="image/jpeg" href="assets/tryhard.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/themes.js"></script>
  <style>
    .cartoon-selector {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem;
      margin-bottom: 2rem;
    }
    .cartoon-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      cursor: pointer;
      font-weight: 700;
      font-size: .88rem;
      color: var(--text-muted);
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }
    .cartoon-pill img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
    .cartoon-pill:hover, .cartoon-pill.active {
      background: rgba(var(--primary-rgb), 0.12);
      border-color: var(--primary);
      color: var(--primary);
    }
    
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .content-animate {
      animation: fadeInSlide 0.5s ease-out forwards;
    }
  </style>
</head>
<body class="anime-context">

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-brand">
    <img src="assets/tryhard.png" alt="Mascote" style="height:50px;width:auto;object-fit:contain;" />
    <span>Anime</span>House
  </div>
  <ul class="navbar-links" id="navLinks">
  </ul>
  <button class="navbar-burger" id="navBurger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<main class="container">
  <div class="page-header">
    <div class="header-main">
      <h1>▶️ Vídeos do YouTube</h1>
      <p>Selecione uma playlist para gerenciar/assistir os vídeos.</p>
    </div>
    <div id="statsWidget" class="stats-widget"></div>
  </div>

  <!-- SELETOR -->
  <div id="playlistPills" class="cartoon-selector"></div>

  <div id="noPlaylistMsg" class="select-cartoon-prompt" style="display:none;">
    ▶️ Selecione uma playlist acima para gerenciar e assistir vídeos.
  </div>
  <div id="noPlaylistRegistered" class="select-cartoon-prompt" style="display:none;">
    📭 Nenhuma playlist cadastrada. <a href="cadastro-youtube.html" style="color:var(--accent2)">Cadastre uma agora.</a>
  </div>

  <div id="videosPanel" style="display:none;">
    <!-- ADICIONAR VIDEO -->
    <form id="videoForm" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem 1.4rem;margin-bottom:1.8rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h3 id="formActionTitle" style="font-family:'Bangers',cursive;font-size:1.4rem;color:var(--primary);letter-spacing:1px;margin:0;">➕ Adicionar Vídeo</h3>
      </div>
      <div class="ep-form-row">
        <div class="form-group" style="flex:2;min-width:200px;">
          <label>Título *</label>
          <input id="videoTitle" class="form-control" type="text" placeholder="Ex: Melhores Momentos..." required />
        </div>
        <div class="form-group" style="flex:3;min-width:260px;">
          <label>Código de Incorporação (iframe) ou URL *</label>
          <input id="videoIframe" class="form-control" type="text" placeholder='<iframe src="..."></iframe> ou https://...' required />
        </div>
        <div class="form-group" style="min-width:fit-content; display:flex; align-items:flex-end; gap:10px;">
          <button type="submit" class="btn btn-primary" id="addVideoBtn">Adicionar</button>
          <button type="button" class="btn btn-ghost" id="cancelVideoBtn" style="display:none;">Cancelar</button>
        </div>
      </div>
    </form>

    <!-- LISTA DE VIDEOS -->
    <div id="videosContainer" class="episodes-grid open"></div>
  </div>
</main>

<!-- MODAL VER VIDEO -->
<div class="modal-overlay" id="watchModal">
  <div class="modal" style="max-width:860px;">
    <div class="modal-header">
      <h2 id="watchTitle">—</h2>
      <button class="modal-close" id="watchClose">✕</button>
    </div>
    <div id="watchFrame" style="width:100%;aspect-ratio:16/9;background:#000;"></div>
    <div class="form-actions" style="margin-top:1rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <button id="watchedModalBadge" class="watched-modal-badge not-watched">○ Marcar como Assistido</button>
      <button class="btn btn-danger btn-sm" id="watchDeleteBtn">🗑️ Remover Vídeo</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="js/db.js"></script>
<script src="js/watched.js"></script>
<script src="js/history.js"></script>
<script src="js/youtube-videos.js"></script>
<script src="js/utils-stats.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<div class="watermark">© ViselBrx & DaviMoraes07™</div>
</body>
</html>
