<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime House — Episódios de Animes</title>
  <meta name="description" content="Assista aos episódios dos seus animes favoritos por temporada." />
  <link rel="icon" type="image/jpeg" href="assets/tryhard.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/themes.js"></script>
  <style>
    .cartoon-selector {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem;
      margin-bottom: 2rem;
    }
    .cartoon-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      cursor: pointer;
      font-weight: 700;
      font-size: .88rem;
      color: var(--text-muted);
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }
    .cartoon-pill img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
    .cartoon-pill:hover, .cartoon-pill.active {
      background: rgba(var(--primary-rgb), 0.12);
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .audio-selector-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .audio-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0px 10px;
      position: relative;
      transition: all 0.3s;
    }
    .audio-tab.active {
      color: var(--primary);
    }
    .audio-tab.active::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--primary);
      border-radius: 3px 3px 0 0;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .content-animate {
      animation: fadeInSlide 0.5s ease-out forwards;
    }
  </style>
</head>
<body class="anime-context">

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <img src="assets/tryhard.png" alt="Mascote" style="height:50px;width:auto;object-fit:contain;" />
    <span>Anime</span>House
  </a>
  <ul class="navbar-links" id="navLinks">
  </ul>
  <button class="navbar-burger" id="navBurger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<main class="container">
  <div class="page-header">
    <div class="header-main">
      <h1>⛩️ Episódios de Animes</h1>
      <p>Selecione um anime e adicione/assista aos episódios por temporada</p>
    </div>
    <div id="statsWidget" class="stats-widget"></div>
  </div>

  <!-- SELETOR -->
  <div id="animePills" class="cartoon-selector"></div>

  <div id="noAnimeMsg" class="select-cartoon-prompt" style="display:none;">
    ⛩️ Selecione um anime acima para gerenciar e assistir episódios.
  </div>
  <div id="noAnimeRegistered" class="select-cartoon-prompt" style="display:none;">
    📭 Nenhum anime cadastrado. <a href="cadastro-animes.html" style="color:var(--accent2)">Cadastre um agora.</a>
  </div>

  <div id="episodePanel" style="display:none;">
    <!-- ADICIONAR EPISÓDIO -->
    <form id="epForm" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem 1.4rem;margin-bottom:1.8rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h3 id="formActionTitle" style="font-family:'Bangers',cursive;font-size:1.4rem;color:var(--primary);letter-spacing:1px;margin:0;">➕ Adicionar Episódio</h3>
        <div style="display:flex;gap:10px;">
          <select id="activeAudioForm" class="form-control" style="width:auto;min-width:120px;height:35px;padding:2px 10px;border-color:var(--accent2);">
            <option value="dublado">Dublado</option>
            <option value="legendado">Legendado</option>
          </select>
          <select id="entryType" class="form-control" style="width:auto;min-width:140px;height:35px;padding:2px 10px;border-color:var(--accent2);">
            <option value="episode">Episódio</option>
            <option value="movie">Filme</option>
          </select>
        </div>
      </div>
      <div class="ep-form-row">
        <div class="form-group" id="groupSeason">
          <label>Temporada *</label>
          <input id="epSeason" class="form-control" type="number" min="1" value="1" placeholder="1" />
        </div>
        <div class="form-group" id="groupNumber">
          <label>Nº Episódio *</label>
          <input id="epNumber" class="form-control" type="number" min="1" value="1" placeholder="1" />
        </div>
        <div class="form-group" style="flex:2;min-width:200px;">
          <label id="labelTitle">Título (opcional)</label>
          <input id="epTitle" class="form-control" type="text" placeholder="Ex: O Despertar do Ninja" />
        </div>
        <div class="form-group" style="flex:3;min-width:260px;">
          <label>Código de Incorporação (iframe) ou URL *</label>
          <input id="epIframe" class="form-control" type="text" placeholder='&lt;iframe src="..."&gt;&lt;/iframe&gt; ou https://...' />
        </div>
        <div class="form-group" style="min-width:fit-content;">
          <label>&nbsp;</label>
          <button type="submit" class="btn btn-primary" id="addEpBtn">Adicionar</button>
        </div>
      </div>
    </form>

    <!-- FILMES -->
    <div id="moviesContainer" style="margin-bottom:2rem;"></div>

    <div class="audio-selector-tabs">
      <button class="audio-tab active" data-audio="dublado">🎙️ Dublado</button>
      <button class="audio-tab" data-audio="legendado">📝 Legendado</button>
    </div>

    <!-- TEMPORADAS -->
    <div id="seasonsContainer"></div>
  </div>
</main>

<!-- MODAL VER EPISÓDIO -->
<div class="modal-overlay" id="watchModal">
  <div class="modal" style="max-width:860px;">
    <div class="modal-header">
      <h2 id="watchTitle">—</h2>
      <button class="modal-close" id="watchClose">✕</button>
    </div>
    <div id="watchFrame" style="width:100%;aspect-ratio:16/9;background:#000;"></div>
    <div class="form-actions" style="margin-top:1rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <button id="watchedModalBadge" class="watched-modal-badge not-watched">○ Marcar como Assistido</button>
      <button class="btn btn-danger btn-sm" id="watchDeleteBtn">🗑️ Remover Episódio</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="js/db.js"></script>
<script src="js/watched.js"></script>
<script src="js/history.js"></script>
<script src="js/anime-episodios.js"></script>
<script src="js/utils-stats.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<div class="watermark">© ViselBrx & DaviMoraes07™</div>
</body>
</html>
