<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime House — Filmes</title>
  <meta name="description" content="Catálogo pessoal de filmes com capa, gênero, ano e diretor." />
  <link rel="icon" type="image/jpeg" href="assets/tryhard.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/themes.js"></script>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-brand">
    <img src="assets/tryhard.png" alt="Mascote" style="height:50px;width:auto;object-fit:contain;" />
    <span>Anime</span>House
  </div>
  <ul class="navbar-links" id="navLinks"></ul>
  <button class="navbar-burger" id="navBurger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- CONTEÚDO PRINCIPAL -->
<main class="main-content">
  <div class="page-header">
    <h1>🎬 Catálogo de Filmes</h1>
    <p>Explore sua coleção de filmes favoritos</p>
  </div>

  <!-- BUSCA E FILTROS -->
  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="🔍  Pesquisar filme..." />
    <select id="filterGenero">
      <option value="">Todos os gêneros</option>
    </select>
    <select id="filterAno">
      <option value="">Todos os anos</option>
    </select>
  </div>

  <!-- GRID DE CARDS -->
  <div id="cardsGrid" class="cards-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="empty-icon">📭</div>
    <p>Nenhum filme encontrado.<br>Acesse <a href="cadastro-filmes.html" style="color:var(--primary)">Cadastro de Filmes</a> para adicionar.</p>
  </div>
</main>

<!-- MODAL DETALHES -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">—</h2>
      <button class="modal-close" id="detailClose">✕</button>
    </div>
    <img id="detailCover" src="" alt="" style="width:100%;max-height:320px;object-fit:cover;border-radius:10px;margin-bottom:1rem;" />
    <div id="detailCoverPlaceholder" class="card-cover-placeholder" style="border-radius:10px;margin-bottom:1rem;display:none;">🎬</div>
    <p><strong>Diretor:</strong> <span id="detailDiretor">—</span></p>
    <p style="margin-top:6px"><strong>Ano:</strong> <span id="detailAno">—</span></p>
    <p style="margin-top:6px"><strong>Gênero:</strong> <span id="detailGenero">—</span></p>
    <div style="display:flex;gap:.8rem;margin-top:1.5rem;flex-wrap:wrap;align-items:center;">
      <button id="watchedDetailBtn" class="watched-modal-badge not-watched">○ Marcar como Assistido</button>
      <button id="detailWatchBtn" class="btn btn-primary" style="flex:1;justify-content:center;">▶️ Assistir Agora</button>
      <a href="cadastro-filmes.html" class="btn btn-ghost" style="flex:1;justify-content:center;">✏️ Gerenciar</a>
    </div>
  </div>
</div>

<!-- MODAL PLAYER -->
<div class="modal-overlay" id="watchModal">
  <div class="modal" style="max-width:900px;">
    <div class="modal-header">
      <h2 id="watchTitle">—</h2>
      <button class="modal-close" id="watchClose">✕</button>
    </div>
    <div id="watchFrame" style="width:100%;aspect-ratio:16/9;background:#000;"></div>
    <div style="margin-top:1rem;display:flex;gap:10px;align-items:center;">
      <button id="watchedModalBadge" class="watched-modal-badge not-watched">○ Marcar como Assistido</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/watched.js"></script>
<script src="js/filmes.js"></script>
<div class="watermark">© ViselBrx & DaviMoraes07™</div>
</body>
</html>
