<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenkai — Filmes</title>
  <meta name="description" content="Catálogo pessoal de filmes com capa, gênero, ano e diretor." />
  <link rel="icon" type="image/jpeg" href="assets/tryhard.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js-ofuscado/themes.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <img src="assets/tryhard.png" alt="Mascote" style="height:50px;width:auto;object-fit:contain;" />
    <span>Zen</span>kai
  </a>
  <ul class="navbar-links" id="navLinks"></ul>
  <button class="navbar-burger" id="navBurger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- CONTEÚDO PRINCIPAL -->
<main class="main-content">
  <div class="page-header" style="flex-direction: column; justify-content: center; align-items: center;">
    <div class="header-main" style="text-align: center;">
      <h1><i class='fa-solid fa-clapperboard'></i> Catálogo de Filmes</h1>
      <p>Explore sua coleção de filmes favoritos</p>
    </div>
    <div id="statsWidget" class="stats-widget" style="margin-top: 15px;"></div>
  </div>

  <!-- BUSCA E FILTROS -->
  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="Pesquisar filme..." />
    <select id="filterGenero">
      <option value="">Todos os gêneros</option>
    </select>
    <select id="filterAno">
      <option value="">Todos os anos</option>
    </select>
    <select id="filterFavoritos">
      <option value="">Todos os itens</option>
      <option value="favoritos">Meus Favoritos</option>
    </select>
  </div>

  <!-- GRID DE CARDS -->
  <div id="cardsGrid" class="cards-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="empty-icon"><i class='fa-solid fa-envelope'></i></div>
    <p>Nenhum filme encontrado.<br>Acesse <a href="cadastro-filmes.html" style="color:var(--primary)">Cadastro de Filmes</a> para adicionar.</p>
  </div>
</main>

<!-- MODAL DETALHES -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">—</h2>
      <div style="display:flex;gap:10px;align-items:center;">
        <button class="modal-close" id="detailClose" style="position:static;">✕</button>
      </div>
    </div>
    <img id="detailCover" src="" alt="" style="width:100%;max-height:220px;object-fit:cover;object-position:top center;border-radius:10px;margin-bottom:1rem;" />
    <div id="detailCoverPlaceholder" class="card-cover-placeholder" style="border-radius:10px;margin-bottom:1rem;max-height:220px;display:none;"><i class='fa-solid fa-clapperboard'></i></div>
    <p><strong>Diretor:</strong> <span id="detailDiretor">—</span></p>
    <p style="margin-top:6px"><strong>Ano:</strong> <span id="detailAno">—</span></p>
    <p style="margin-top:6px"><strong>Gênero:</strong> <span id="detailGenero">—</span></p>
    <div style="display:flex;gap:.8rem;margin-top:1.5rem;flex-wrap:wrap;align-items:center;">
      <button id="watchedDetailBtn" class="watched-modal-badge not-watched">○ Marcar como Assistido</button>
      <button id="detailWatchBtn" class="btn btn-primary" style="flex:1;justify-content:center;"><i class='fa-solid fa-play'></i> Assistir Agora</button>
      <a href="cadastro-filmes.html" class="btn btn-ghost" style="flex:1;justify-content:center;"><i class='fa-solid fa-pencil'></i> Gerenciar</a>
    </div>
  </div>
</div>

<!-- MODAL PLAYER -->
<div class="modal-overlay" id="watchModal">
  <div class="modal" style="max-width:900px;">
    <div class="modal-header">
      <h2 id="watchTitle">—</h2>
      <button class="modal-close" id="watchClose">✕</button>
    </div>
    <div id="watchFrame" style="width:100%;aspect-ratio:16/9;background:#000;"></div>
    <div style="margin-top:1rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <button id="watchedModalBadge" class="watched-modal-badge not-watched">○ Marcar como Assistido</button>
      <div style="display:flex; gap:5px; align-items:center;">
        <input type="text" id="watchTimeNote" placeholder="12:34" maxlength="20" style="background:var(--bg-body); color:var(--text); border:1px solid var(--border); border-radius:var(--radius); padding:0.4rem 0.8rem; width:100px; font-size:0.9rem;" title="Minuto em que você parou">
        <button class="btn btn-primary btn-sm" id="saveTimeNoteBtn" style="padding:0.4rem 0.8rem;">Salvar Tempo</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js-ofuscado/auth.js"></script>
<script src="js-ofuscado/db.js"></script>
<script src="js-ofuscado/watched.js"></script>
<script src="js-ofuscado/history.js"></script>
<script src="js-ofuscado/filmes.js"></script>
<script src="js-ofuscado/utils-stats.js"></script>
<div class="watermark">&copy; ViselBrx & DaviMoraes07&trade;</div>
<script src="js-ofuscado/custom-select.js"></script>
<script src="js-ofuscado/guard.js"></script>
</body>
</html>
