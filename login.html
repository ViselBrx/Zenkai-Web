<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime House — Login</title>
  <meta name="description" content="Faça login para acessar o painel de administração." />
  <link rel="icon" type="image/jpeg" href="assets/tryhard.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/themes.js"></script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 110px);
      padding: 2rem;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid rgba(var(--primary-rgb), 0.2);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 0 40px rgba(0,0,0,0.4), 0 0 20px rgba(var(--primary-rgb), 0.2);
      animation: fadeInUp 0.6s ease forwards;
    }
    @media (max-width: 480px) {
      .auth-container {
        padding: 1rem;
      }
      .auth-card {
        padding: 1.5rem;
      }
      .auth-title {
        font-size: 2rem;
      }
    }
    .auth-title {
      text-align: center;
      color: var(--primary);
      margin-bottom: 0.5rem;
      font-family: 'Bangers', cursive;
      font-size: 2.5rem;
      letter-spacing: 2px;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .auth-form .form-group {
      margin-bottom: 1.5rem;
    }
    .auth-form label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
    }
    .auth-form input {
      width: 100%;
      padding: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      transition: all var(--transition);
    }
    .auth-form input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(var(--primary-rgb), 0.3);
      outline: none;
    }
    .auth-links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }
    .auth-links a {
      color: var(--primary);
      font-weight: 600;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
    .auth-error {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
      text-align: center;
      border: 1px solid var(--danger);
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-brand">
    <img src="assets/tryhard.png" alt="Mascote" style="height:50px;width:auto;object-fit:contain;" />
    <span>Anime</span>House
  </div>
  <ul class="navbar-links" id="navLinks">
  </ul>
  <button class="navbar-burger" id="navBurger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<main class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Entrar</h1>
    <p class="auth-subtitle">Acesso exclusivo para administradores</p>
    
    <div id="loginError" class="auth-error">Email ou senha incorretos.</div>
    <div id="loginSuccess" class="auth-success" style="display:none; line-height:1.6; color:var(--success); background:rgba(16,185,129,0.1); padding:10px; border-radius:8px; margin-bottom:1rem; font-size:0.9rem; text-align:center; border:1px solid var(--success);"></div>
    
    <form class="auth-form" id="loginForm">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="digite seu e-mail" required />
      </div>
      <div class="form-group">
        <label for="password" style="display:flex; justify-content:space-between;">
          <span>Senha</span>
          <a href="#" id="forgotPasswordLink" style="font-size:0.85rem; color:var(--primary); font-weight:normal; text-decoration:none;">Esqueci a senha?</a>
        </label>
        <div style="position:relative;">
          <input type="password" id="password" placeholder="digite sua senha" required style="padding-right: 40px;" />
          <button type="button" id="togglePassword" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.2rem; padding:0; display:flex; align-items:center; justify-content:center;"></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
        Entrar no Painel
      </button>
    </form>
    
    <div class="auth-links">
      <p style="color:var(--text-muted)">Não tem uma conta? <a href="registro.html">Cadastre-se</a></p>
    </div>
  </div>
</main>

<div id="toast"></div>
<script src="js/auth.js"></script>
<div class="watermark">© ViselBrx & DaviMoraes07™</div>
</body>
</html>
