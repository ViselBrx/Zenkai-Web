<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime House — Cadastro de Animes</title>
  <meta name="description" content="Cadastre, edite e exclua animes da sua coleção." />
  <link rel="icon" type="image/jpeg" href="assets/tryhard.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/themes.js"></script>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-brand">
    <img src="assets/tryhard.png" alt="Mascote" style="height:50px;width:auto;object-fit:contain;" />
    <span>Anime</span>House
  </div>
  <ul class="navbar-links" id="navLinks">
  </ul>
  <button class="navbar-burger" id="navBurger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<main class="container">
  <div class="page-header">
    <h1>📋 Gerenciar Animes</h1>
    <p>Cadastre, edite e exclua os animes da sua coleção</p>
  </div>

  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="🔍  Pesquisar..." />
    <select id="filterEstudio">
      <option value="">Todos os estúdios</option>
    </select>
    <button class="btn btn-primary" id="addBtn" style="background:var(--accent2);box-shadow:0 4px 16px rgba(124,58,237,0.35);">✚ Novo Anime</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Capa</th>
          <th>Nome</th>
          <th>Estúdio</th>
          <th>Gênero</th>
          <th>Temps</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="empty-icon">📭</div>
    <p>Nenhum anime cadastrado ainda. Clique em <strong>Novo Anime</strong>.</p>
  </div>
</main>

<!-- MODAL ADD/EDIT -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="formTitle">Novo Anime</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <form id="animeForm" novalidate>
      <input type="hidden" id="animeId" />
      <div class="form-group">
        <label for="nome">Nome *</label>
        <input id="nome" class="form-control" type="text" placeholder="Ex: Naruto Shippuden" required />
      </div>
      <div class="form-group">
        <label for="estudio">Estúdio *</label>
        <input id="estudio" class="form-control" type="text" placeholder="Ex: Studio Pierrot" required />
      </div>
      <div class="form-group">
        <label for="genero">Gênero</label>
        <input id="genero" class="form-control" type="text" placeholder="Ex: Shounen, Ação" />
      </div>
      <div class="form-group">
        <label for="temporadas">Quantidade de Temporadas</label>
        <input id="temporadas" class="form-control" type="number" min="1" value="1" />
      </div>
      <div class="form-group">
        <label for="capa">Capa (Upload de Arquivo local ou URL)</label>
        <div style="display:flex;gap:10px;align-items:center;">
          <input id="capaFile" class="form-control" type="file" accept="image/*" style="flex:1" />
          <span style="font-size:0.8rem;color:var(--text-muted)">ou</span>
          <input id="capa" class="form-control" type="url" placeholder="https://..." style="flex:1" />
        </div>
        <div id="capaPreview" style="margin-top:10px;display:none;">
          <img id="capaImg" src="" alt="Preview" style="width:80px;height:106px;object-fit:cover;border-radius:8px;border:1px solid var(--border);" />
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="saveBtn" style="background:var(--accent2);box-shadow:0 4px 16px rgba(124,58,237,0.35);">💾 Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL CONFIRM DELETE -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <h2 style="color:var(--danger)">⚠️ Excluir</h2>
      <button class="modal-close" id="deleteClose">✕</button>
    </div>
    <p style="color:var(--text-muted);line-height:1.6;">Tem certeza que deseja excluir <strong id="deleteAnimeName"></strong>? Todos os episódios cadastrados também serão removidos.</p>
    <div class="form-actions">
      <button class="btn btn-ghost" id="deleteCancelBtn">Cancelar</button>
      <button class="btn btn-danger" id="deleteConfirmBtn">🗑️ Excluir</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="js/db.js"></script>
<script src="js/cadastro-animes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
</body>
</html>
