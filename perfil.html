<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime House — Meu Perfil</title>
  <link rel="icon" type="image/jpeg" href="assets/tryhard.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/themes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .profile-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .profile-card {
      background: var(--bg-card);
      border: 1px solid rgba(var(--primary-rgb), 0.2);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--shadow-md);
      animation: fadeInUp 0.6s ease;
    }
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
      text-align: center;
    }
    .profile-avatar-large {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--primary);
      box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.4);
      margin-bottom: 15px;
    }
    .profile-email {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-main);
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(var(--primary-rgb), 0.3);
    }
    .actions {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <a href="index.html" style="display:flex; align-items:center; gap:12px;">
      <img src="assets/tryhard.png" alt="Mascote" style="height:50px;width:auto;" />
      <span>Anime</span>House
    </a>
  </div>
  <ul class="navbar-links" id="navLinks"></ul>
  <button class="navbar-burger" id="navBurger"><span></span><span></span><span></span></button>
</nav>

<main class="profile-container">
  <div class="profile-card">
    <div class="profile-header">
      <img id="displayAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="profile-avatar-large" alt="Avatar" />
      <h2 id="displayUsername" style="color:var(--primary); font-family:'Bangers'; font-size: 2rem;">Carregando...</h2>
      <p id="displayEmail" class="profile-email">---</p>
    </div>

    <form id="profileForm">
      <div class="form-group">
        <label for="username">Nome de Exibição</label>
        <input type="text" id="username" placeholder="Seu nome" required />
      </div>
      
      <div class="form-group">
        <label for="avatarFile">Sua Foto de Perfil (Upload)</label>
        <input type="file" id="avatarFile" accept="image/*" style="margin-bottom: 10px;" />
        <p style="font-size: 0.8rem; color:var(--text-muted)">Ou cole uma URL abaixo:</p>
      </div>

      <div class="form-group">
        <label for="avatarUrl">URL da Foto</label>
        <input type="url" id="avatarUrl" placeholder="https://exemplo.com/foto.jpg" />
      </div>
      
      <div class="actions">
        <button type="submit" class="btn btn-primary" style="flex:1;">Salvar Alterações</button>
        <button type="button" id="logoutBtn" class="btn btn-danger">Sair</button>
      </div>
    </form>
    
    <div style="margin-top: 20px; text-align: center;">
        <a href="index.html" style="color:var(--text-muted); font-size: 0.9rem;">← Voltar ao Início</a>
    </div>
  </div>
</main>

<div id="toast"></div>

<!-- Lógica do Perfil -->
<script src="js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
      // Aguarda o supaClient ser inicializado no auth.js
      const checkClient = setInterval(async () => {
          if (window.supabaseClient) {
              clearInterval(checkClient);
              await initProfile();
          }
      }, 100);

      async function initProfile() {
          const supabase = window.supabaseClient;
          const { data: { user } } = await supabase.auth.getUser();

          if (!user) {
              window.location.href = 'login.html';
              return;
          }

          // Busca dados do perfil
          const { data: profile } = await supabase
              .from('profiles')
              .select('*')
              .eq('id', user.id)
              .single();

          if (profile) {
              document.getElementById('username').value = profile.username || '';
              document.getElementById('avatarUrl').value = profile.avatar_url || '';
              document.getElementById('displayUsername').textContent = profile.username || 'Usuário';
              document.getElementById('displayAvatar').src = profile.avatar_url || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
          }
          document.getElementById('displayEmail').textContent = user.email;

          // Upload de Imagem
          document.getElementById('avatarFile').onchange = async (e) => {
              const file = e.target.files[0];
              if (!file) return;

              showToast('Enviando imagem...');
              const fileExt = file.name.split('.').pop();
              const fileName = `${user.id}-${Math.floor(Date.now() / 1000)}.${fileExt}`;

              const { data, error: uploadError } = await supabase.storage
                  .from('avatars')
                  .upload(fileName, file);

              if (uploadError) {
                  console.error(uploadError);
                  showToast('Erro no upload: ' + uploadError.message, true);
                  return;
              }

              // Pega a URL pública
              const { data: { publicUrl } } = supabase.storage
                  .from('avatars')
                  .getPublicUrl(fileName);

              document.getElementById('avatarUrl').value = publicUrl;
              document.getElementById('displayAvatar').src = publicUrl;
              showToast('Imagem carregada! Não esqueça de Salvar Alterações.');
          };

          // Salvar
          document.getElementById('profileForm').onsubmit = async (e) => {
              e.preventDefault();
              const username = document.getElementById('username').value;
              const avatar_url = document.getElementById('avatarUrl').value;

              const { error: updateError } = await supabase
                  .from('profiles')
                  .upsert({
                      id: user.id,
                      username,
                      avatar_url,
                      updated_at: new Date()
                  });

              if (updateError) {
                  showToast('Erro ao salvar: ' + updateError.message, true);
              } else {
                  showToast('Perfil atualizado!');
                  setTimeout(() => window.location.reload(), 1000);
              }
          };

          document.getElementById('logoutBtn').onclick = async () => {
              await supabase.auth.signOut();
              window.location.href = 'index.html';
          };
      }
  });
</script>
<div class="watermark">© ViselBrx & DaviMoraes07™</div>
</body>
</html>
