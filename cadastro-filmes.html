<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime House — Cadastro de Filmes</title>
  <meta name="description" content="Cadastre, edite e exclua filmes da sua coleção." />
  <link rel="icon" type="image/jpeg" href="assets/tryhard.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/themes.js"></script>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-brand">
    <img src="assets/tryhard.png" alt="Mascote" style="height:50px;width:auto;object-fit:contain;" />
    <span>Anime</span>House
  </div>
  <ul class="navbar-links" id="navLinks"></ul>
  <button class="navbar-burger" id="navBurger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<main class="container">
  <div class="page-header" style="flex-direction: column; justify-content: center; align-items: center;">
    <div class="header-main" style="text-align: center;">
      <h1>Gerenciar Filmes</h1>
    </div>
  </div>

  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="🔍  Pesquisar..." />
    <select id="filterGenero">
      <option value="">Todos os gêneros</option>
    </select>
    <button class="btn btn-primary" id="addBtn">✚ Novo Filme</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Capa</th>
          <th>Nome</th>
          <th>Diretor</th>
          <th>Gênero</th>
          <th>Ano</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="empty-icon">📭</div>
    <p>Nenhum filme cadastrado ainda. Clique em <strong>Novo Filme</strong>.</p>
  </div>
</main>

<!-- MODAL ADD/EDIT -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="formTitle">Novo Filme</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <form id="filmeForm" novalidate>
      <input type="hidden" id="filmeId" />
      <div class="form-group">
        <label for="nome">Nome *</label>
        <input id="nome" class="form-control" type="text" placeholder="Ex: O Poderoso Chefão" required />
      </div>
      <div class="form-group">
        <label for="diretor">Diretor</label>
        <input id="diretor" class="form-control" type="text" placeholder="Ex: Francis Ford Coppola" />
      </div>
      <div class="form-group">
        <label for="genero">Gênero</label>
        <input id="genero" class="form-control" type="text" placeholder="Ex: Drama, Crime" />
      </div>
      <div class="form-group">
        <label for="ano">Ano de Lançamento</label>
        <input id="ano" class="form-control" type="number" min="1900" max="2099" placeholder="Ex: 1972" />
      </div>
      <div class="form-group">
        <label>Capa (Upload ou URL)</label>
        <div class="form-row">
          <input id="capaFile" class="form-control" type="file" accept="image/*" />
          <span style="font-size:0.8rem;color:var(--text-muted)">ou</span>
          <input id="capaUrl" class="form-control" type="url" placeholder="https://..." />
        </div>
        <div id="capaPreview" style="margin-top:10px;display:none;">
          <img id="capaImg" src="" alt="Preview" style="width:80px;height:106px;object-fit:cover;border-radius:8px;border:1px solid var(--border);" />
        </div>
      </div>
      <div class="form-group">
        <label for="iframe">Código de Incorporação (iframe) ou URL *</label>
        <textarea id="iframe" class="form-control" rows="3" placeholder='<iframe src="..."></iframe> ou https://...' style="resize:vertical;"></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">💾 Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL CONFIRM DELETE -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <h2 style="color:var(--danger)">⚠️ Excluir</h2>
      <button class="modal-close" id="deleteClose">✕</button>
    </div>
    <p style="color:var(--text-muted);line-height:1.6;">Tem certeza que deseja excluir <strong id="deleteFilmeName"></strong>?</p>
    <div class="form-actions">
      <button class="btn btn-ghost" id="deleteCancelBtn">Cancelar</button>
      <button class="btn btn-danger" id="deleteConfirmBtn">🗑️ Excluir</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/cadastro-filmes.js"></script>
<div class="watermark">© ViselBrx & DaviMoraes07™</div>
</body>
</html>
